name: Backend CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/backend.yml"
      - "edge/**"
      - "libraries/**"
      - "services/**"
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/backend.yml"
      - "edge/**"
      - "libraries/**"
      - "services/**"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOCKER_BUILDKIT: 0

jobs:
  libraries:
    name: libraries build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore library projects
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Path libraries -Recurse -Filter *.csproj |
            Where-Object { $_.FullName -match "[/\\]src[/\\]" } |
            Sort-Object FullName

          if ($projects.Count -eq 0) {
            throw "No library source projects found."
          }

          foreach ($project in $projects) {
            dotnet restore $project.FullName
          }

      - name: Build library projects
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Path libraries -Recurse -Filter *.csproj |
            Where-Object { $_.FullName -match "[/\\]src[/\\]" } |
            Sort-Object FullName

          foreach ($project in $projects) {
            dotnet build $project.FullName --configuration Release --no-restore
          }

      - name: Test library projects
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Path libraries -Recurse -Filter *Tests.csproj |
            Sort-Object FullName

          if ($projects.Count -eq 0) {
            Write-Host "No library test projects found."
            exit 0
          }

          foreach ($project in $projects) {
            dotnet test --project $project.FullName --configuration Release --no-restore
          }

  services:
    name: services build and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore service projects
        shell: pwsh
        run: |
          $projects = @(
            Get-ChildItem -Path edge -Recurse -Filter *.csproj
            Get-ChildItem -Path services -Recurse -Filter *.csproj |
              Where-Object { $_.FullName -match "[/\\]src[/\\]" }
          ) | Sort-Object FullName

          if ($projects.Count -eq 0) {
            throw "No service source projects found."
          }

          foreach ($project in $projects) {
            dotnet restore $project.FullName
          }

      - name: Build service projects
        shell: pwsh
        run: |
          $projects = @(
            Get-ChildItem -Path edge -Recurse -Filter *.csproj
            Get-ChildItem -Path services -Recurse -Filter *.csproj |
              Where-Object { $_.FullName -match "[/\\]src[/\\]" }
          ) | Sort-Object FullName

          foreach ($project in $projects) {
            dotnet build $project.FullName --configuration Release --no-restore
          }

      - name: Test service projects
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Path services -Recurse -Filter *Tests.csproj |
            Where-Object { $_.FullName -notmatch "Integration\.Tests" } |
            Sort-Object FullName

          if ($projects.Count -eq 0) {
            Write-Host "No service test projects found."
            exit 0
          }

          foreach ($project in $projects) {
            dotnet test --project $project.FullName --configuration Release --no-restore
          }

  integration-tests:
    name: service integration tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run integration test projects
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Path services -Recurse -Filter *Integration.Tests.csproj |
            Sort-Object FullName

          if ($projects.Count -eq 0) {
            Write-Host "No service integration test projects found."
            exit 0
          }

          foreach ($project in $projects) {
            dotnet test --project $project.FullName --configuration Release
          }
