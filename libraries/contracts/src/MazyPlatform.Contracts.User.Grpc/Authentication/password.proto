syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/api/annotations.proto";
import "common.proto";

package mazy_platform.user.authentication.v1;

option csharp_namespace = "MazyPlatform.Contracts.User.Grpc.Authentication";

// Сервис управления паролями.
service PasswordService {
    // Смена пароля авторизованного пользователя.
    // Возвращает MFA challenge если требуется подтверждение или success если пароль изменён.
    rpc ChangePassword (ChangePasswordRequest) returns (ChangePasswordResponse) {
        option (google.api.http) = {
            post: "/api/v1/password/change"
            body: "*"
        };
    }

    // Установка пароля для авторизованного пользователя.
    // Возвращает MFA challenge если требуется подтверждение или success если пароль установлен.
    rpc SetPassword (SetPasswordRequest) returns (SetPasswordResponse) {
        option (google.api.http) = {
            post: "/api/v1/password/set"
            body: "*"
        };
    }

    // Запрос сброса пароля.
    // Возвращает OTP challenge или MFA challenge в зависимости от настроек пользователя.
    rpc ResetPassword (ResetPasswordRequest) returns (ResetPasswordResponse) {
        option (google.api.http) = {
            post: "/api/v1/password/reset"
            body: "*"
        };
    }

    // Подтверждение сброса пароля и установка нового.
    rpc ConfirmResetPassword (ConfirmResetPasswordRequest) returns (google.protobuf.Empty) {
        option (google.api.http) = {
            post: "/api/v1/password/reset/confirm"
            body: "*"
        };
    }
}

// Запрос на смену пароля.
message ChangePasswordRequest {
    // Текущий пароль пользователя.
    string current_password = 1;
    // Новый пароль пользователя.
    string new_password = 2;
    // ID MFA сессии. Передаётся после прохождения MFA.
    optional string mfa_session_id = 3;
}

// Ответ на смену пароля.
message ChangePasswordResponse {
    oneof result {
        // MFA challenge если требуется подтверждение.
        MfaChallenge challenge = 1;
        // Успешная смена пароля.
        google.protobuf.Empty success = 2;
    }
}

// Запрос на установку пароля.
message SetPasswordRequest {
    // Новый пароль пользователя.
    string new_password = 1;
    // ID MFA сессии если включен MFA. Передаётся после прохождения MFA.
    optional string mfa_session_id = 2;
}

// Ответ на установку пароля.
message SetPasswordResponse {
    oneof result {
        // MFA challenge если требуется подтверждение.
        MfaChallenge challenge = 1;
        // Успешная установка пароля.
        google.protobuf.Empty success = 2;
    }
}

// Запрос на сброс пароля.
message ResetPasswordRequest {
    // Email пользователя.
    string email = 1;
}

// Ответ на запрос сброса пароля.
message ResetPasswordResponse {
    oneof result {
        // OTP challenge если у пользователя нет MFA.
        OtpChallenge otp = 1;
        // MFA challenge если у пользователя есть MFA.
        MfaChallenge mfa = 2;
    }
}

// OTP challenge для подтверждения через email.
message OtpChallenge {
    // ID OTP сессии.
    string otp_id = 1;
}

// Запрос на подтверждение сброса пароля.
message ConfirmResetPasswordRequest {
    // Новый пароль пользователя.
    string new_password = 1;
    oneof confirmation {
        // Подтверждение через OTP.
        OtpConfirmation otp = 2;
        // Подтверждение через MFA сессию.
        MfaConfirmation mfa = 3;
    }
}

// Подтверждение через OTP.
message OtpConfirmation {
    // ID OTP сессии.
    string otp_id = 1;
    // Код из письма.
    string code = 2;
}

// Подтверждение через MFA сессию.
message MfaConfirmation {
    // ID завершённой MFA сессии.
    string mfa_session_id = 1;
}
