syntax = "proto3";

import "google/api/annotations.proto";
import "common.proto";

package mazy_platform.user.authentication.v1;

option csharp_namespace = "MazyPlatform.Contracts.User.Grpc.Authentication";

// Сервис регистрации пользователей.
service RegistrationService {
    // Регистрация по email и паролю.
    // Возвращает otp_id для подтверждения email.
    rpc RegisterByPassword (RegisterByPasswordRequest) returns (RegisterByPasswordResponse) {
        option (google.api.http) = {
            post: "/api/v1/auth/registration/password"
            body: "*"
        };
    }

    // Завершение регистрации через подтверждение email.
    // Возвращает токены при успешном подтверждении.
    rpc CompleteRegistration (CompleteRegistrationRequest) returns (CompleteRegistrationResponse) {
        option (google.api.http) = {
            post: "/api/v1/auth/registration/complete"
            body: "*"
        };
    }

    // Повторная отправка кода подтверждения email.
    rpc ResendConfirmationCode (ResendConfirmationCodeRequest) returns (ResendConfirmationCodeResponse) {
        option (google.api.http) = {
            post: "/api/v1/auth/registration/resend"
            body: "*"
        };
    }
}

// Запрос на регистрацию по паролю.
message RegisterByPasswordRequest {
    // Email пользователя.
    string email = 1;
    // Пароль пользователя.
    string password = 2;
}

// Ответ на регистрацию по паролю.
message RegisterByPasswordResponse {
    // ID OTP сессии для подтверждения email.
    string otp_id = 1;
}

// Запрос на завершение регистрации.
message CompleteRegistrationRequest {
    // ID OTP сессии.
    string otp_id = 1;
    // Код из письма.
    string otp_code = 2;
}

// Ответ на завершение регистрации.
message CompleteRegistrationResponse {
    // Токены при успешной регистрации.
    TokenPair tokens = 1;
}

// Запрос на повторную отправку кода.
message ResendConfirmationCodeRequest {
    // Email пользователя.
    string email = 1;
}

// Ответ на повторную отправку кода.
message ResendConfirmationCodeResponse {
    // ID новой OTP сессии.
    string otp_id = 1;
}
