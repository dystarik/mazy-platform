syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "common.proto";

package mazy_platform.user.authentication.v1;

option csharp_namespace = "MazyPlatform.Contracts.User.Grpc.Authentication";

// Сервис управления пользовательскими сессиями.
service UserSessionService {
    // Обновление access токена по refresh токену.
    // Возвращает новую пару токенов.
    rpc RefreshSession (RefreshSessionRequest) returns (RefreshSessionResponse) {
        option (google.api.http) = {
            post: "/api/v1/sessions/refresh"
            body: "*"
        };
    }

    // Завершение сессии по её ID.
    rpc Logout (LogoutRequest) returns (google.protobuf.Empty) {
        option (google.api.http) = {
            post: "/api/v1/sessions/logout"
            body: "*"
        };
    }

    // Выход из всех сессий.
    rpc LogoutAll (LogoutAllRequest) returns (google.protobuf.Empty) {
        option (google.api.http) = {
            post: "/api/v1/sessions/logout-all"
            body: "*"
        };
    }

    // Получение списка активных сессий пользователя.
    rpc GetSessions (google.protobuf.Empty) returns (GetSessionsResponse) {
        option (google.api.http) = {
            get: "/api/v1/sessions"
        };
    }
}

// Запрос на обновление сессии.
message RefreshSessionRequest {
    // ID refresh токена.
    string refresh_token_id = 1;
    // Refresh токен.
    string refresh_token = 2;
}

// Ответ на обновление сессии.
message RefreshSessionResponse {
    // Новая пара токенов.
    TokenPair tokens = 1;
}

// Запрос на завершение сессии.
message LogoutRequest {
    // ID refresh токена сессии которую нужно завершить.
    string refresh_token_id = 1;
}

// Запрос на завершение всех сессий.
message LogoutAllRequest {
    // Если true — текущая сессия не завершается.
    bool exclude_current_session = 1;
}

// Информация о сессии пользователя.
message SessionInfo {
    // ID refresh токена сессии.
    string refresh_token_id = 1;
    // Время создания сессии.
    google.protobuf.Timestamp created_at = 2;
    // true если это текущая сессия.
    bool is_current = 3;
}

// Ответ на получение списка сессий.
message GetSessionsResponse {
    // Список активных сессий.
    repeated SessionInfo sessions = 1;
}
